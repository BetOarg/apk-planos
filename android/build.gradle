allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // FIX: Forzar Kotlin Gradle Plugin >= 1.5.20 en todos los subproyectos.
    // ar_flutter_plugin 0.7.3 trae Kotlin 1.3.50, incompatible con AGP 8.x.
    buildscript {
        configurations.classpath {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-gradle-plugin') {
                    details.useVersion '1.9.23'
                }
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// FIX: Solo asigna namespace y compileSdk a librerías de terceros viejas.
// El hack de "apply flutter.gradle" fue eliminado porque crasha en Flutter 3.24
// al aplicarse a librerías (com.android.library).
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.android.namespace == null) {
            subproject.android.namespace = subproject.group ?: "com.example.${subproject.name}"
        }
        subproject.android.compileSdkVersion = 34
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
