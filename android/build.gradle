allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// FIX: Parchea el kotlin-gradle-plugin en todos los subproyectos (plugins de Flutter)
// antes de que evalúen su buildscript. Esto corrige ar_flutter_plugin que trae 1.3.50.
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-gradle-plugin') {
                    details.useVersion '1.9.23'
                }
            }
        }
    }
}

// FIX: Solo asigna namespace y compileSdk a librerías de terceros viejas.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.android.namespace == null) {
            subproject.android.namespace = subproject.group ?: "com.example.${subproject.name}"
        }
        subproject.android.compileSdkVersion = 34
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
