name: room_scanner_ar
description: "Aplicación de escaneo de habitaciones en Realidad Aumentada y generación de planos 2D."
publish_to: 'none'
version: 2.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  ar_flutter_plugin: ^0.7.3
  provider: ^6.1.2
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  vector_math: ^2.1.4
  permission_handler: ^10.4.5
  geolocator: ^9.0.2

# FIX: Fuerza geolocator_android 4.6.1 que no tiene el bug con Flutter 3.24
dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/sphere.gltf
