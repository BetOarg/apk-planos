buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// 1. OBLIGA A TODOS LOS SUBPROYECTOS (incluyendo ar_flutter_plugin) A USAR KOTLIN 1.8.22
subprojects { subproject ->
    subproject.buildscript {
        repositories {
            google()
            mavenCentral()
        }
        configurations.configureEach {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:$rootProject.ext.kotlin_version"
            }
        }
    }
    
    subproject.configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootProject.ext.kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootProject.ext.kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$rootProject.ext.kotlin_version"
        }
    }
}

// 2. ASIGNA NAMESPACE DINÁMICO A LIBRERÍAS SIN NAMESPACE
subprojects {
    project.afterEvaluate { p ->
        if (p.hasProperty('android')) {
            if (p.android.namespace == null) {
                p.android.namespace = p.group ?: "com.example.${p.name}"
            }
            p.android.compileSdkVersion = 34
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}