allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// SOLUCIÓN DEFINITIVA: Inyecta namespace a plugins legados (.pub-cache) como ar_flutter_plugin
subprojects {
    project.afterEvaluate { p ->
        if (p.hasProperty('android')) {
            if (p.android.namespace == null) {
                p.android.namespace = p.group ?: "com.example.${p.name}"
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}